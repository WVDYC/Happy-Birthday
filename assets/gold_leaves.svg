<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#917019"/>
      <stop offset="100%" stop-color="#4a3605"/>
    </linearGradient>
    <linearGradient id="leafVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffe885" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Vine hugging corner -->
  <path d="M 0,22 C 30,20 60,18 90,16 C 105,15 115,20 120,22" fill="none" stroke="url(#leafGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 22,0 C 20,30 18,60 16,90 C 15,105 20,115 22,120" fill="none" stroke="url(#leafGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Curled tendrils -->
  <path d="M 95,16 C 105,10 112,4 118,6 C 122,8 120,14 114,14 C 108,14 106,8 112,6" fill="none" stroke="url(#leafGrad)" stroke-width="1.2"/>
  <path d="M 16,95 C 10,105 4,112 6,118 C 8,122 14,120 14,114 C 14,108 8,106 6,112" fill="none" stroke="url(#leafGrad)" stroke-width="1.2"/>
  
  <!-- Top Leaf with veins -->
  <path d="M 50,18 C 65,4 85,2 96,12 C 90,24 75,28 60,24 Z" fill="url(#leafGrad)" stroke="#ffe885" stroke-width="0.6"/>
  <path d="M 54,18 Q 74,12 92,10" fill="none" stroke="url(#leafVein)" stroke-width="0.8"/>
  <path d="M 68,15 Q 75,18 80,22 M 76,13 Q 82,16 86,18" fill="none" stroke="url(#leafVein)" stroke-width="0.5"/>
  
  <!-- Left Leaf with veins -->
  <path d="M 18,50 C 4,65 2,85 12,96 C 24,90 28,75 24,60 Z" fill="url(#leafGrad)" stroke="#ffe885" stroke-width="0.6"/>
  <path d="M 18,54 Q 12,74 10,92" fill="none" stroke="url(#leafVein)" stroke-width="0.8"/>
  <path d="M 15,68 Q 18,75 22,80 M 13,76 Q 16,82 18,86" fill="none" stroke="url(#leafVein)" stroke-width="0.5"/>
  
  <!-- Small diagonal leaf pair -->
  <path d="M 28,18 C 36,10 45,12 50,18 C 44,23 35,22 28,18 Z" fill="url(#leafGrad)" stroke="#ffe885" stroke-width="0.5"/>
  <path d="M 18,28 C 10,36 12,45 18,50 C 23,44 22,35 18,28 Z" fill="url(#leafGrad)" stroke="#ffe885" stroke-width="0.5"/>
</svg>